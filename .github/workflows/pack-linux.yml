name: pack-linux
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx electron-builder --linux AppImage
